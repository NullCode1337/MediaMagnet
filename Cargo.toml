[workspace]
resolver = "2"
members = ["crates/mm-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["NullCode1337"]
repository = "NullCode1337/MediaMagnet"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "process", "time", "sync", "io-util"] }
shell-words = "1.1.1"
which = "8.0.2"
regex = "1.12.3"
