[workspace]
resolver = "2"
members = ["crates/mm-core", "crates/mm-server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["NullCode1337"]
repository = "NullCode1337/MediaMagnet"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "net", "signal"] }
shell-words = "1.1.1"
which = "8.0.2"
regex = "1.12.3"
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs", "trace", "cors", "set-header"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "0.3"
mime_guess = "2.0.5"
