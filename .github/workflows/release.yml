name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  GALLERY_DL_VERSION: '1.32.1'
  YTDLP_VERSION: '2026.03.17'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # Apple Silicon Mac
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Download sidecar binaries (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          TRIPLE="${{ matrix.target }}"
          DEST="src-tauri/binaries"
          mkdir -p "$DEST"

          curl -fsSL "https://codeberg.org/mikf/gallery-dl/releases/download/v${GALLERY_DL_VERSION}/gallery-dl.bin" \
            -o "$DEST/gallery-dl-${TRIPLE}"

          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_macos" \
            -o "$DEST/yt-dlp-${TRIPLE}"

          chmod +x "$DEST/gallery-dl-${TRIPLE}" "$DEST/yt-dlp-${TRIPLE}"

      - name: Download sidecar binaries (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          TRIPLE="${{ matrix.target }}"
          DEST="src-tauri/binaries"
          mkdir -p "$DEST"

          curl -fsSL "https://codeberg.org/mikf/gallery-dl/releases/download/v${GALLERY_DL_VERSION}/gallery-dl.bin" \
            -o "$DEST/gallery-dl-${TRIPLE}"

          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux" \
            -o "$DEST/yt-dlp-${TRIPLE}"

          chmod +x "$DEST/gallery-dl-${TRIPLE}" "$DEST/yt-dlp-${TRIPLE}"

      - name: Download sidecar binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          TRIPLE="${{ matrix.target }}"
          DEST="src-tauri/binaries"
          mkdir -p "$DEST"

          curl -fsSL "https://codeberg.org/mikf/gallery-dl/releases/download/v${GALLERY_DL_VERSION}/gallery-dl.exe" \
            -o "$DEST/gallery-dl-${TRIPLE}.exe"

          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp.exe" \
            -o "$DEST/yt-dlp-${TRIPLE}.exe"

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: ${{ github.event.inputs.draft }}
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}