name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # Apple Silicon (M1+)
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'   # Intel Mac
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Prepare sidecar binaries
        if: matrix.platform != 'macos-latest'
        shell: bash
        run: |
          TRIPLE="${{ matrix.target }}"
          DEST="src-tauri/binaries"
          mkdir -p "$DEST"

          for src in prebuilts/*-"${TRIPLE}"*; do
            [ -f "$src" ] || { echo "No prebuilts found for $TRIPLE — aborting"; exit 1; }
            cp "$src" "$DEST/$(basename "$src")"
            echo "Copied $src → $DEST/$(basename "$src")"
          done

          chmod +x "$DEST"/*-"${TRIPLE}" || true

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: ${{ github.event.inputs.draft }}
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}