name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_STANDALONE_RELEASE: '20261013'
  PYTHON_VERSION: '3.12'
  DENO_VERSION: '2.9.7'
  FFMPEG_STATIC_RELEASE: 'b6.1.1'

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            ffmpeg: 'system'
          - platform: 'ubuntu-24.04-arm'
            target: 'aarch64-unknown-linux-gnu'
            args: '--target aarch64-unknown-linux-gnu'
            ffmpeg: 'system'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            ffmpeg: 'win64'
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc'
            ffmpeg: 'winarm64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            ffmpeg: 'darwin-arm64'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
            ffmpeg: 'darwin-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Relative paths only: GNU tar on the Windows runners parses a drive-letter
      # path such as D:\a\_temp as a remote host.
      - name: Bundle Python runtime
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BIN="apps/desktop/src-tauri/binaries"
          TMP="target/tools/$TARGET_TRIPLE"
          rm -rf "$TMP" "$BIN/python"
          mkdir -p "$TMP" "$BIN/python"

          AUTH=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          URL="$(curl -fsSL ${AUTH[@]+"${AUTH[@]}"} \
            "https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/$PYTHON_STANDALONE_RELEASE" \
            | tr ',' '\n' \
            | sed -n "s/.*\"browser_download_url\": *\"\\([^\"]*cpython-$PYTHON_VERSION\\.[^\"]*-$TARGET_TRIPLE-install_only\\.tar\\.gz\\)\".*/\\1/p" \
            | head -n1)"
          if [ -z "$URL" ]; then
            echo "no Python $PYTHON_VERSION build for $TARGET_TRIPLE" >&2
            exit 1
          fi

          curl -fsSL "$URL" -o "$TMP/python.tar.gz"
          tar -xzf "$TMP/python.tar.gz" -C "$BIN/python" --strip-components=1

          if [ -f "$BIN/python/python.exe" ]; then
            PYTHON="$BIN/python/python.exe"
          else
            PYTHON="$BIN/python/bin/python3"
          fi

          "$PYTHON" -m pip install --no-cache-dir --disable-pip-version-check --upgrade \
            "yt-dlp[default]" \
            "gallery-dl[extra]" \
            "spotdl"

      - name: Bundle Deno
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="apps/desktop/src-tauri/binaries"
          TMP="target/tools/$TARGET_TRIPLE"
          PYBIN="$(command -v python3 || command -v python)"
          mkdir -p "$TMP"
          curl -fsSL "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-$TARGET_TRIPLE.zip" \
            -o "$TMP/deno.zip"
          "$PYBIN" -m zipfile -e "$TMP/deno.zip" "$TMP/deno"
          cp "$TMP"/deno/deno* "$BIN/"
          chmod +x "$BIN"/deno 2>/dev/null || true

      - name: Bundle ffmpeg (Windows)
        if: startsWith(matrix.ffmpeg, 'win')
        shell: bash
        run: |
          set -euo pipefail
          BIN="apps/desktop/src-tauri/binaries"
          TMP="target/tools/${{ matrix.target }}"
          PYBIN="$(command -v python3 || command -v python)"
          mkdir -p "$TMP"
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-${{ matrix.ffmpeg }}-lgpl-9.0.zip" \
            -o "$TMP/ffmpeg.zip"
          "$PYBIN" -m zipfile -e "$TMP/ffmpeg.zip" "$TMP/ffmpeg"
          for tool in ffmpeg ffprobe; do
            found="$(find "$TMP/ffmpeg" -type f -name "$tool.exe" | head -n1)"
            if [ -z "$found" ]; then
              echo "the ffmpeg archive did not contain $tool.exe" >&2
              exit 1
            fi
            cp "$found" "$BIN/$tool.exe"
          done

      - name: Bundle ffmpeg (macOS)
        if: startsWith(matrix.ffmpeg, 'darwin')
        shell: bash
        run: |
          set -euo pipefail
          BIN="apps/desktop/src-tauri/binaries"
          for tool in ffmpeg ffprobe; do
            curl -fsSL "https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_STATIC_RELEASE}/${tool}-${{ matrix.ffmpeg }}" \
              -o "$BIN/$tool"
            chmod +x "$BIN/$tool"
          done

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: ${{ github.event.inputs.draft }}
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  server:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-24.04-arm'
            target: 'aarch64-unknown-linux-gnu'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Package server
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/package-server.sh

      # The runner is the target platform, so the tools can be bundled here.
      - name: Package server with tools
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/package-server.sh --with-tools

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  server-release:
    needs: server
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: server-v${{ steps.version.outputs.version }}
          name: Server v${{ steps.version.outputs.version }}
          body: Standalone MediaMagnet server binaries. The API and web SPA are embedded in the binary; yt-dlp, gallery-dl, spotdl, ffmpeg and optionally Deno must be on PATH.
          draft: ${{ github.event.inputs.draft == 'true' }}
          files: dist/*.tar.gz

  docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
